notice:
  label_ko: 모집 중
  label_en: Recruiting
  items_ko:
    - "**학부연구생 / 석사과정 / 박사과정 / 석박사통합과정** 학생을 모집 중입니다. 자세한 내용은 [연락처](contact/)를 참고해 주세요."
