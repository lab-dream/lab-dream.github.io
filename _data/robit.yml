url: https://kwrobit.com/

intro_ko: >-
  RO:BIT(로빛)은 2006년 창단한 광운대학교 로봇게임단으로, 학부생들이 로봇을 직접 설계·제작하고 국내외 로봇
  경진대회에 출전합니다. 로빛 8기 출신인 박수한 교수가 2025년부터 지도교수를 맡고 있으며, DREAM Lab.은 로빛
  학부생들과 휴머노이드 보행 등 공동 연구를 진행하고 있습니다.
intro_en: >-
  RO:BIT is Kwangwoon University's robot game team, founded in 2006, where undergraduates design and build their
  own robots and compete in robotics competitions. Prof. Suhan Park, a RO:BIT alumnus (8th generation), has been
  the team's advisor since 2025, and DREAM Lab. collaborates with RO:BIT students on research such as humanoid walking.
button_ko: RO:BIT 홈페이지 더 알아보기
button_en: Visit the RO:BIT website

