apply:
  intro_ko: 지원은 이메일로 받습니다. 아래 내용을 함께 보내 주세요.
  intro_en: Send us an email to apply, including the items below.
  email_title: "[Lab Application] your-name"
  requirements_ko:
    - 희망 과정 / 포지션
    - CV 또는 포트폴리오 (국문 또는 영문)
    - 간단한 지원 동기 (국문 또는 영문)
  requirements_en:
    - Preferred program / position
    - CV or portfolio (in Korean or English)
    - A brief description of your motivation (in Korean or English)

