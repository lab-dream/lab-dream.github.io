- date: 2026-09-07
  tag: event
  text_ko: >-
    연구실 인턴십 프로그램 초청강연 “재현 가능한 ROS 2 시스템 — 시행착오에서 연구로”(이상훈 박사, DGIST)가 열렸습니다.
    [안내 페이지](/ros2_special_lecture/)
  text_en: >-
    Invited talk for our internship program: “Reproducible ROS 2 Systems — From Trial and Error to Research”
    (Sanghoon Lee, Ph.D., DGIST). [Event page](/ros2_special_lecture/)

- date: 2026-04-10
  tag: award
  text_ko: >-
    한국로봇산업진흥원(KIRIA) **휴머노이드 리얼-월드 챌린지 1위**를 차지했습니다 — 롯데글로벌로지스 현장에서
    휴머노이드 '이그리스'로 의류 포장을 자동화한 실증입니다. 🏆 [로봇신문](https://www.irobotnews.com/news/articleView.html?idxno=45849)
  text_en: >-
    DREAM Lab. won **1st place at the KIRIA Humanoid Real-World Challenge** for automating garment packing with
    the humanoid IGRIS at a Lotte Global Logistics site. 🏆 [The Robot Times](https://www.irobotnews.com/news/articleView.html?idxno=45849)

- date: 2026-01-22
  tag: event
  text_ko: >-
    박수한 교수가 총괄한 국내 첫 공식 ROS 개발자 컨퍼런스 **ROSCon Korea 2026**이 광운대 판교캠퍼스에서 열렸습니다.
    [파이낸셜뉴스](https://www.fnnews.com/news/202601291515370422)
  text_en: >-
    **ROSCon Korea 2026**, Korea's first official ROS developer conference, chaired by Prof. Suhan Park, was held at
    Kwangwoon University's Pangyo Campus.
    [The Korea Times](https://www.koreatimes.co.kr/southkorea/20260129/kwangwoon-university-hosts-robot-developer-conference)

- date: 2025-11-26
  tag: grant
  text_ko: >-
    산업통상부 과제에 선정되었습니다 — *AI 파운데이션 모델 기반 유통 공정 특화 휴머노이드 로봇 개발*
    (2025, 공동연구). [언론보도](https://zdnet.co.kr/view/?no=20251126093456)
  text_en: >-
    DREAM Lab. won a government grant from the Ministry of Trade, Industry and Resources (MOTIR) —
    *Development of a humanoid robot specialized for distribution processes based on AI foundation models*
    (joint research). [Press](https://zdnet.co.kr/view/?no=20251126093456)

