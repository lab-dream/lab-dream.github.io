# ─────────────────────────────────────────────────────────────
#  Publications
#
#  ▸ 새 논문은 이 파일의 "맨 위"에 추가하세요. (같은 연도 안에서는 파일 순서대로 표시)
#  ▸ 필드 설명
#      title      (필수) 논문 제목
#      authors    (필수) "이름, 이름, 이름" 형식의 한 줄. members.yml의 name과 같으면 자동 강조됩니다.
#                        공동 1저자는 이름 뒤에 *, 교신저자는 † 를 붙이세요.  예) "Dongwoo Son*, Suhan Park†"
#      venue      (필수) 표시할 학회/저널 약칭      예) IEEE ICRA, IEEE RA-L
#      venue_full (선택) 전체 이름 (마우스를 올리면 표시)
#      year       (필수) 연도
#      type       (필수) journal | conference | workshop | preprint | thesis
#      note       (선택) 작은 배지     예) SCIE, Oral, Under Review
#      award      (선택) 수상 배지     예) Best Paper Award
#      selected   (선택) true 이면 홈 화면 "Selected Publications"에 표시
#      topics     (선택) research.yml의 id 목록 → Research 페이지의 관련 논문에 자동 표시
#      image      (선택) 썸네일 경로 (assets/img/pubs/ 에 파일을 넣고 경로를 적습니다)
#      video      (선택) 짧은 영상(mp4). 화면에 보일 때만 소리 없이 반복 재생되고, image 는 재생 전 사진이 됩니다.
#      links      (선택) paper, pdf, arxiv, project, code, video, slides, poster, dataset
#      bibtex     (선택) BibTeX 원문. 있으면 "BibTeX" 버튼이 생깁니다.
#
#  ▸ Google Scholar의 BibTeX를 이 형식으로 바꾸려면:  python3 tools/bib2yml.py paper.bib
# ─────────────────────────────────────────────────────────────

# ── 아래 워크숍 논문들은 News에 소개되었지만 저자 정보가 없어 비워 두었습니다.
#    저자를 채운 뒤 주석(#)을 지우면 목록에 나타납니다.
