- series: Special Lecture
  series_ko: 초청강연
  title_ko: "재현 가능한 ROS 2 시스템 — 시행착오에서 연구로"
  title_en: "Reproducible ROS 2 Systems — From Trial and Error to Research"
  date: 2026-09-07
  time_ko: 오후 7시 – 9시
  time_en: 7 – 9 PM
  speaker_ko: 이상훈 박사
  speaker_en: Sanghoon Lee, Ph.D.
  speaker_affiliation: DGIST, Research Group for Bio-Embodied Physical AI
  location_ko: 광운대학교 새빛관 101호
  location_en: Saebit-gwan 101, Kwangwoon University
  language: ko
  description_ko: >-
    DREAM Lab. 연구실 인턴십 프로그램 초청강연. ROSCon KR 연사를 모시고 로봇 개발에서 자주 겪는 ROS 2 문제와
    그 원인, 재현 가능한 로봇 소프트웨어 개발에 대해 이야기합니다. 사전 신청 없이 참석할 수 있으며 외부 학생 청강을 환영합니다.
  description_en: >-
    An invited talk for the DREAM Lab. internship program. A ROSCon KR speaker discusses common ROS 2
    problems in robot development, why they happen, and what reproducible robot software requires.
    No registration needed; students from outside the lab are welcome.
  links:
    - label_ko: 안내 페이지
      label_en: Event page
      url: /ros2_special_lecture/

