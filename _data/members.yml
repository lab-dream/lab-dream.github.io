# ─────────────────────────────────────────────────────────────
#  Members
#
#  ▸ group: professor | graduate | undergraduate | alumni
#    (그룹 제목과 순서는 _data/member_groups.yml 에서 바꿀 수 있습니다)
#  ▸ 한국어 페이지에서는 name_ko, 영어 페이지에서는 name 이 먼저 크게 표시됩니다.
#  ▸ name 은 publications.yml의 저자 이름과 똑같이 적어야 논문 목록에서 자동 강조됩니다.
#  ▸ 사진은 assets/img/members/ 에 넣고 photo 에 경로를 적습니다. (세로 3:4 비율 권장)
#    사진이 없으면 이름 첫 글자로 된 기본 이미지가 표시됩니다.
#  ▸ 졸업하면 group 을 alumni 로 바꾸고 graduated / now 를 적어 주세요.
#
#  선택 필드: name_ko, program, photo, interests, email, github, homepage, scholar, linkedin,
#             since, graduated, now
#
#  ▸ slug 를 적으면 개인 페이지가 생깁니다. (주소: /members/<slug>/ , /ko/members/<slug>/)
#    페이지 파일도 members/<slug>.html 과 ko/members/<slug>.html 두 개가 있어야 하니
#    기존 학생 파일을 복사해서 person: 값만 바꾸면 됩니다.
#  ▸ research: 에 자기가 하는 연구를 적습니다. 비워 두면 연구 관심사와 논문만 나옵니다.
#
#    research:
#      - title_ko: 한 줄 제목
#        title_en: One-line title
#        desc_ko: >-
#          두세 문장으로 무엇을 왜 하는지. 사람이 읽는 글이라고 생각하고 쓰세요.
#        desc_en: >-
#          Two or three sentences.
#        tags: [Motion Planning, GPU]          # 선택
#        image: /assets/img/members/work.jpg   # 선택
#        video: /assets/video/work.mp4         # 선택 (image 와 함께 쓰면 썸네일이 됩니다)
#        links:                                # 선택
#          paper: https://...
#          code: https://github.com/...
#          video: https://youtu.be/...
# ─────────────────────────────────────────────────────────────

