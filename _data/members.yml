# ── Graduate Students ────────────────────────────────────────
- name: Dongwoo Son
  slug: dongwoo-son
  name_ko: 손동우
  group: graduate
  photo: /assets/img/members/dongwoo-son.jpg
  interests: [Imitation Learning, Manipulation]
  github: https://github.com/son-dongwoo
  research:
    - title_ko: 학습한 정책이 내놓는 행동 묶음 다듬기
      title_en: Smoothing action chunks produced by learned policies
      desc_ko: >-
        모방학습 정책은 한 번에 여러 스텝짜리 행동 묶음을 내놓습니다. 묶음이 바뀌는 자리에서
        속도가 튀거나 움직임이 끊기는데, 정책을 다시 학습하지 않고 뒤쪽에서 가벼운 최적화로
        이 이음매를 다듬는 방법을 연구했습니다. LiPo 로 IJCAS 2025 에 실었습니다.
      desc_en: >-
        Imitation policies emit a chunk of actions at a time, and the seams between chunks
        show up as velocity jumps. This work adds a lightweight post-optimization stage that
        smooths those seams without retraining the policy, published as LiPo in IJCAS 2025.
      tags: [Imitation Learning, Action Chunking, Trajectory Optimization]
      image: /assets/img/pubs/son2025lipo-toss.png
      video: /assets/video/pub-lipo-toss.mp4
      links:
        paper: https://doi.org/10.1007/s12555-025-0537-0
        arxiv: https://arxiv.org/abs/2506.05165
        project: https://sites.google.com/view/action-lipo

