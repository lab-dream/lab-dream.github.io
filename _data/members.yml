- name: Gahyun Oh
  slug: gahyun-oh
  name_ko: 오가현
  group: graduate
  photo: /assets/img/members/gahyun-oh.jpg
  interests: [Manipulator, Planning & Control]
  github: https://github.com/gahyun0425
  research:
    - title_ko: GPU로 병렬화한 제약 조건 모션 플래닝
      title_en: GPU-parallel constrained motion planning
      desc_ko: >-
        문을 열거나 물건을 양손으로 드는 동작은 "손의 자세를 유지한다" 같은 등식 제약을
        만족하는 경로만 쓸 수 있습니다. 제약을 만족하는 공간을 접평면 다발로 다루면서
        RRT-Connect 를 GPU에서 한꺼번에 돌려 탐색 속도를 올리는 PATACON 을 1저자로 썼습니다.
      desc_en: >-
        Opening a door or carrying an object with both hands only admits paths that satisfy
        equality constraints. PATACON, which I lead, treats the constraint manifold as a
        tangent bundle and runs RRT-Connect in parallel on the GPU.
      tags: [Motion Planning, Constrained Manifold, GPU]
      image: /assets/img/research/patacon.jpg
      video: /assets/video/patacon-replanning.mp4
      links:
        project: /patacon_paper/

- name: Junho An
  slug: junho-an
  name_ko: 안준호
  group: graduate
  photo: /assets/img/members/junho-an.jpg
  interests: [Imitation Learning, Constrained Motion Planning]
  github: https://github.com/AnJunHo98
  research:
    - title_ko: 제약 조건이 있는 모션 플래닝
      title_en: Constrained motion planning
      desc_ko: >-
        손의 자세나 양팔 사이 거리처럼 등식으로 적히는 제약을 지키면서 경로를 찾는 문제를
        다룹니다. 접평면 다발 위에서 탐색을 GPU로 병렬화한 PATACON 에 공저자로 참여했습니다.
      desc_en: >-
        Planning paths that keep equality constraints such as a fixed end-effector pose or a
        fixed relative transform between two arms. I am a co-author of PATACON, which runs the
        tangent-bundle search in parallel on the GPU.
      tags: [Motion Planning, Constrained Manifold]
      links:
        project: /patacon_paper/

